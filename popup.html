<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <title>Scrapbox Information Viewer for IML</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      width: 360px;
      padding: 16px;
      background: #fff;
      color: #333;
    }
    h1 {
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 4px;
      color: #555;
      letter-spacing: 0.03em;
    }
    #page-title {
      font-size: 13px;
      color: #888;
      margin-bottom: 12px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    #status {
      font-size: 13px;
      color: #999;
      margin-top: 8px;
    }
    .bar-row {
      display: flex;
      align-items: center;
      margin-bottom: 8px;
      gap: 8px;
    }
    .bar-label {
      width: 100px;
      font-size: 12px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .bar-track {
      flex: 1;
      height: 16px;
      background: #f0f0f0;
      border-radius: 4px;
      overflow: hidden;
    }
    .bar-fill {
      height: 100%;
      background: #4a90e2;
      border-radius: 4px;
      transition: width 0.3s ease;
    }
    .bar-count {
      width: 36px;
      font-size: 12px;
      text-align: right;
      color: #666;
      flex-shrink: 0;
    }
    .bar-row:nth-child(1) .bar-fill { background: #4a90e2; }
    .bar-row:nth-child(2) .bar-fill { background: #5ba85a; }
    .bar-row:nth-child(3) .bar-fill { background: #e2844a; }
    .bar-row:nth-child(4) .bar-fill { background: #9b59b6; }
    .bar-row:nth-child(5) .bar-fill { background: #e74c3c; }
    .bar-row:nth-child(n+6) .bar-fill { background: #95a5a6; }
    #total {
      margin-top: 10px;
      font-size: 11px;
      color: #aaa;
      text-align: right;
    }
    #toggle-btn {
      display: block;
      width: 100%;
      margin-top: 8px;
      padding: 6px 0;
      background: none;
      border: 1px solid #ddd;
      border-radius: 6px;
      font-size: 12px;
      color: #888;
      cursor: pointer;
      text-align: center;
    }
    #toggle-btn:hover {
      background: #f5f5f5;
      color: #555;
    }
  </style>
</head>
<body>
  <h1>Scrapbox Contribution Viewer</h1>
  <div id="page-title"></div>
  <div id="chart"></div>
  <button id="toggle-btn" style="display:none"></button>
  <div id="total"></div>
  <div id="status">読み込み中...</div>
  <script src="popup.js"></script>
</body>
</html>
